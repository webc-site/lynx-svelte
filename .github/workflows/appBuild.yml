name: appBuild

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: appBuild-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lynx-svelte

jobs:
  web:
    name: web site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lynx-svelte
        uses: actions/checkout@v7
        with:
          path: lynx-svelte
      - name: Setup workspace
        uses: ./lynx-svelte/.github/actions/setup
      - name: Build site
        run: bun tool/webBuild.js
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-site
          path: lynx-svelte/dist/web
          if-no-files-found: error
      - name: Upload site zip
        uses: actions/upload-artifact@v7
        with:
          name: web-zip
          path: lynx-svelte/dist/lynx-svelte-web.zip
          if-no-files-found: error
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: lynx-svelte/dist/web

  deploy-pages:
    name: deploy site
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  desktop:
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac
            os: macos-latest
          - target: win
            os: windows-latest
          - target: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout lynx-svelte
        uses: actions/checkout@v7
        with:
          path: lynx-svelte
      - name: Setup workspace
        uses: ./lynx-svelte/.github/actions/setup
      - name: Build desktop app
        run: bun tool/desktopBuild.js --target=${{ matrix.target }}
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: lynx-svelte/dist/desktop
          if-no-files-found: error

  android:
    name: android apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lynx-svelte
        uses: actions/checkout@v7
        with:
          path: lynx-svelte
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Setup workspace
        uses: ./lynx-svelte/.github/actions/setup
      - name: Build APK
        run: bun tool/androidBuild.js
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: lynx-svelte/dist/android
          if-no-files-found: error

  ios:
    name: ios simulator app
    runs-on: macos-15
    steps:
      - name: Checkout lynx-svelte
        uses: actions/checkout@v7
        with:
          path: lynx-svelte
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Setup workspace
        uses: ./lynx-svelte/.github/actions/setup
      - name: Build iOS app
        run: bun tool/iosBuild.js
      - name: Upload iOS app
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator
          path: lynx-svelte/dist/ios
          if-no-files-found: error

  release:
    name: release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - web
      - desktop
      - android
      - ios
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/**/*
          generate_release_notes: true
